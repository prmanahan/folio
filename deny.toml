[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # chrono is unmaintained; no fixed version exists. Test-only: reached via
    # axum-test (dev-dependency) -> expect-json -> chrono, never in the shipped
    # binary. Recorded 2026-11-18 (#4851), Peter ruled "record and watch".
    # The ignore is by ID across the whole graph, so it holds only while chrono
    # stays out of the shipped graph. scripts/check-chrono-dev-only.sh, a step
    # in the required "Test & Lint" job (.github/workflows/test.yml), enforces
    # that: it fails if chrono enters the normal/build graph, and fails when
    # chrono leaves Cargo.lock, which is the signal to delete this ignore and
    # that script. Do not add an ignore to cargo-audit's own config.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; test-only via axum-test -> expect-json; held by scripts/check-chrono-dev-only.sh, which fails when chrono leaves Cargo.lock (then remove this ignore)" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
deny = [
    # Prefer rustls over openssl for TLS
    { crate = "openssl-sys", wrappers = [] },
]
# Transitive duplicates from ecosystem version transitions — reviewed 2026-03-26
skip = [
    { crate = "core-foundation" },
    { crate = "cpufeatures" },
    { crate = "getrandom" },
    { crate = "hashbrown" },
    { crate = "r-efi" },
    { crate = "rand" },
    { crate = "rand_core" },
    { crate = "schemars" },
    { crate = "schemars_derive" },
    { crate = "thiserror" },
    { crate = "thiserror-impl" },
    { crate = "windows-sys" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
