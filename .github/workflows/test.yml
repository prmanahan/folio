name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      # Pinned to the same version as rust-toolchain.toml. The @rev selects the
      # toolchain for this action, so the ref IS the version. Bumping means
      # editing this ref and rust-toolchain.toml together.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt

      # Acceptance evidence for the pin, not decoration. rust-toolchain.toml
      # outranks the `rustup default` this action sets, so the line that
      # matters is `active-toolchain`: it names the version AND why it is
      # active ("overridden by .../rust-toolchain.toml" vs "it's the default
      # toolchain"). Without it, a future drift is invisible in the log again.
      - name: Report active Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo clippy --version

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2.9.1

      - name: Install Node 22
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run check
          npm run test:unit
          npm run build

      - name: Run tests
        run: cargo test --workspace

      - name: Run Clippy
        run: cargo clippy -- -D warnings
