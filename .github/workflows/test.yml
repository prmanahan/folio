name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # #4711: the invisible-unicode strip set is generated from Node's bundled
  # ICU data into a Rust and a TS table. Pinned to the exact Node build that
  # generated the committed tables (24.14.0: ICU 78.2, Unicode 17.0), because
  # the property data depends on the Node/ICU build, not only the major; the
  # test job's Node 22 would generate a different table and fail this check
  # for the wrong reason. Bumping Node means regenerating the tables, and
  # editing the single pin in .node-version (read by both workflows).
  invisible-tables:
    name: Invisible-Unicode tables are current
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install Node from .node-version
        uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .node-version

      - name: Check generated tables
        run: node scripts/gen-invisible.mjs --check

  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      # Pinned to the same version as rust-toolchain.toml. The @rev selects the
      # toolchain for this action, so the ref IS the version. Bumping means
      # editing this ref and rust-toolchain.toml together.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt

      # Acceptance evidence for the pin, not decoration. rust-toolchain.toml
      # outranks the `rustup default` this action sets, so the line that
      # matters is `active-toolchain`: it names the version AND why it is
      # active ("overridden by .../rust-toolchain.toml" vs "it's the default
      # toolchain"). Without it, a future drift is invisible in the log again.
      - name: Report active Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo clippy --version

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2.9.1

      # Cheapest check first, and before the frontend build: a formatting
      # failure takes ~2s and should not cost an npm install plus a cargo
      # test run. Mirrors `just check`, which runs fmt ahead of clippy and
      # test. `--check` reports without rewriting; the toolchain pin above
      # is what makes the result deterministic across rustfmt releases.
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install Node 22
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run check
          npm run test:unit
          npm run build

      - name: Check built CSP
        run: cd frontend && npm run check:csp

      # The guard fails closed: each bypass-shape fixture must fail, the good
      # one must pass.
      - name: Test the CSP guard against fixtures
        run: cd frontend && npm run test:csp

      - name: Run tests
        run: cargo test --workspace

      # `--all-targets` puts test targets under the same lint bar as the
      # library; without it no test target is ever linted.
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
