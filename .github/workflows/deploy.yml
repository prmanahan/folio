# Deploy workflow — triggers on push to main, runs tests first, then deploys.
#
# Design: Single workflow with two jobs (test -> deploy) rather than two separate
# workflow files. This eliminates the race condition that workflow_run introduces:
# with workflow_run, a push triggers both workflows simultaneously and the deploy
# workflow waits for the test workflow to complete by name — but if two pushes land
# close together, the deploy can pair with the wrong test run. A single file with
# needs: [test] is unambiguous: this deploy runs after these tests, full stop.
#
# The test job duplicates test.yml intentionally. On PRs, only test.yml runs.
# On push to main, this workflow runs the full test+deploy sequence.
# test.yml gives PR authors fast feedback without deploy side effects.
#
# Required secret: FLY_API_TOKEN, an Environment secret on `production` (deployment
# branch policy: main only), generate with: fly tokens create deploy -a folio-prmanahan -x 8760h

name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      # Pinned to the same version as rust-toolchain.toml. The @rev selects the
      # toolchain for this action, so the ref IS the version. Bumping means
      # editing this ref and rust-toolchain.toml together.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt

      # Acceptance evidence for the pin, not decoration. rust-toolchain.toml
      # outranks the `rustup default` this action sets, so the line that
      # matters is `active-toolchain`: it names the version AND why it is
      # active ("overridden by .../rust-toolchain.toml" vs "it's the default
      # toolchain"). Without it, a future drift is invisible in the log again.
      - name: Report active Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo clippy --version

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2.9.1

      # Cheapest check first, and before the frontend build: a formatting
      # failure takes ~2s and should not cost an npm install plus a cargo
      # test run. Mirrors `just check` and test.yml. `--check` reports
      # without rewriting; the toolchain pin above is what makes the result
      # deterministic across rustfmt releases.
      - name: Check formatting
        run: cargo fmt --all -- --check

      # A stale invisible-Unicode table must not deploy. Pinned to the exact
      # Node build the tables were generated with (.node-version, also read by test.yml's
      # invisible-tables job); Node 22 below is a different ICU build. Runs
      # before the Node 22 install, which then replaces it on PATH.
      - name: Install Node from .node-version (table generator)
        uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .node-version

      - name: Check invisible-Unicode tables are current
        run: node scripts/gen-invisible.mjs --check

      - name: Install Node 22
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: cd frontend && npm ci && npm run check && npm run test:unit && npm run build && npm run check:csp && npm run test:csp

      - name: Run tests
        run: cargo test --workspace

      # `--all-targets` puts test targets under the same lint bar as the
      # library; without it no test target is ever linted.
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: [test]
    environment: production

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@1.5

      # #4726: writes frontend/static/projects.json, which the Docker build copies
      # into the image. No `if`, `continue-on-error` or fallback: a failed fetch
      # stops the job before Deploy (spec R-2, R-7). GITHUB_TOKEN is read-only
      # (`contents: read`) and appears here and nowhere else outside Deploy.
      - name: Fetch projects list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node frontend/scripts/fetch-projects.mjs

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

      - name: Post-deploy health check
        run: curl --retry 5 --retry-delay 5 --max-time 30 --fail https://peter.manahan.io/api/health

      # Task #3558: the public hostname (through Cloudflare) must keep
      # serving normally, while the raw Fly origin — page and static
      # asset alike — must reject direct traffic. A regression here means
      # the origin lock stopped covering the path it was added to cover.
      - name: Post-deploy origin-closure check
        run: |
          set -euo pipefail

          check_status() {
            local description="$1" url="$2" expected="$3"
            local actual
            # `|| rc=$?` keeps a curl failure (e.g. exit 28, --max-time) from
            # aborting under `set -e` before the FAILED line is printed.
            local rc=0
            actual=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --max-time 30 "$url") || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "FAILED: $description — curl exited $rc for $url"
              exit 1
            fi
            if [ "$actual" != "$expected" ]; then
              echo "FAILED: $description — expected $expected from $url, got $actual"
              exit 1
            fi
            echo "OK: $description ($actual)"
          }

          check_status "public site root via Cloudflare" "https://peter.manahan.io/" 200
          check_status "raw Fly origin root" "https://folio-prmanahan.fly.dev/" 404
          check_status "raw Fly origin static asset" "https://folio-prmanahan.fly.dev/favicon.png" 404

      # #4710: the response header CSP is the build-validated policy the server
      # reads from csp-header.txt: the page's meta policy plus
      # `; frame-ancestors 'none'`. The expectation is derived from the fetched
      # page's own meta tag, so a server that fell back to its minimal policy
      # (file missing or unusable) or sends anything else fails here. The 304
      # revalidation of `/` must carry the same value, since its headers update
      # the cached page. `?v=$GITHUB_SHA` keeps the request off any cached copy
      # of an old deploy.
      - name: Post-deploy CSP check
        run: |
          set -euo pipefail

          fail() { echo "FAILED: $1"; exit 1; }

          # curl --retry with -D can append a retried attempt's headers to the
          # same file, doubling the CSP count. Retry by hand and truncate the
          # header file on every attempt. Prints curl's stdout (e.g. -w).
          # On failure LAST_STATUS holds the final attempt's HTTP status
          # (or "none" if curl produced none, e.g. a timeout) and LAST_RC its
          # exit code, for the message.
          LAST_STATUS=none
          LAST_RC=0
          get() {
            local hfile="$1" n; shift
            for n in 1 2 3 4 5; do
              : > "$hfile"
              LAST_RC=0
              curl -s --max-time 30 -D "$hfile" "$@" || LAST_RC=$?
              if [ "$LAST_RC" -eq 0 ]; then return 0; fi
              LAST_STATUS=$(head -n1 "$hfile" | tr -d '\r' | awk '{print $2}')
              LAST_STATUS=${LAST_STATUS:-none}
              sleep 5
            done
            return 1
          }

          url="https://peter.manahan.io/?v=${GITHUB_SHA}"

          # Exactly one CSP header, byte-equal to $EXPECTED_CSP.
          assert_one_csp() {
            local what="$1" file="$2" count value
            count=$(grep -ci '^content-security-policy:' "$file" || true)
            [ "$count" = "1" ] || fail "$what: expected exactly 1 Content-Security-Policy header, got $count"
            value=$(grep -i '^content-security-policy:' "$file" | tr -d '\r' | sed -E 's/^[^:]*:[[:space:]]*//')
            [ "$value" = "$EXPECTED_CSP" ] \
              || fail "$what: CSP header is '$value', expected '$EXPECTED_CSP'"
          }

          headers=$(mktemp)
          body=$(mktemp)
          get "$headers" --fail -o "$body" "$url" || fail "GET / failed after 5 attempts (last HTTP status: $LAST_STATUS, curl exit code: $LAST_RC)"

          grep -qi '^x-frame-options:' "$headers" \
            || fail "GET / has no X-Frame-Options header"
          grep -i '^content-type:' "$headers" | grep -qi 'charset=utf-8' \
            || fail "GET / Content-Type has no charset=utf-8: '$(grep -i '^content-type:' "$headers" | tr -d '\r')'"

          meta=$(tr '\n' ' ' < "$body" | grep -ioE -m1 '<meta[^>]*http-equiv="content-security-policy"[^>]*>' || true)
          [ -n "$meta" ] || fail "GET / HTML has no content-security-policy meta tag"
          meta_csp=$(printf '%s' "$meta" | sed -nE 's/.*[[:space:]]content="([^"]*)".*/\1/p')
          [ -n "$meta_csp" ] || fail "could not read the content attribute of the CSP meta tag"
          printf '%s' "$meta_csp" | grep -qE "script-src[^;]*'sha256-" \
            || fail "meta CSP script-src has no sha256- hash"
          EXPECTED_CSP="${meta_csp}; frame-ancestors 'none'"

          assert_one_csp "GET /" "$headers"

          headers304=$(mktemp)
          # Not a $(...) capture: LAST_STATUS must survive in this shell.
          statusfile=$(mktemp)
          get "$headers304" --fail -o /dev/null -w '%{http_code}' \
            -H 'If-Modified-Since: Fri, 01 Jan 2100 00:00:00 GMT' "$url" > "$statusfile" \
            || fail "conditional GET / failed after 5 attempts (last HTTP status: $LAST_STATUS, curl exit code: $LAST_RC)"
          status=$(tail -c 3 "$statusfile")
          [ "$status" = "304" ] || fail "conditional GET / expected 304, got $status"
          assert_one_csp "304 /" "$headers304"

          echo "OK: header CSP is the meta policy plus frame-ancestors on 200 and 304, charset=utf-8 on HTML"

