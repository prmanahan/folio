# Daily list-freshness check (spec docs/specs/2026-11-18-live-lists-and-blog-move.md, R-32).
#
# Reads https://peter.manahan.io/api/lists/freshness, waits 150 s, reads again, and goes red unless
# both list times in the second read are within [now - 48 h, now + 5 min]. A red run emails the
# repository owner through GitHub's own failed-workflow notice, which is the alert path.
#
# A control, so it is held small: no secret, no environment, no env, `contents: read` only, and
# nothing but the two scripted steps. deploy-workflow.test.ts asserts each of those.
#
# 06:17 UTC, off the top of the hour where GitHub's scheduler is busiest, and after the refresh
# cycle has long settled.

name: Freshness (daily)

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    name: Daily list freshness check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - name: Check list freshness
        run: node frontend/scripts/check-freshness-daily.mjs
