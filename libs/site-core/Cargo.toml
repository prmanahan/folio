[package]
name = "site-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
path = "./site_core.rs"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
tower-http = { workspace = true }
uuid = { workspace = true }
rig-core = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true }
schemars = { workspace = true }
dotenvy = { workspace = true }
argon2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
mime_guess = { workspace = true }
time = { workspace = true, features = ["parsing", "formatting", "macros"] }
url = { workspace = true }
jiff = { workspace = true, features = ["std"] }
# R-1 to R-5: the one outbound client. Same version and TLS feature as rig-core's, so the
# lockfile gains no package. No decompression feature: R-3 forbids decoding a body.
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }
# The type a certificate-class error is recognised by (R-2, R-30). Already in Cargo.lock.
rustls = { version = "0.23", default-features = false, features = ["std"] }

[dev-dependencies]
axum-test = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
mockito = "1"
# R-5 TLS test harness. rcgen is held to a dev-dependency by scripts/check-dev-only.sh:
# default features off, the aws-lc-rs provider reqwest already builds, no `pem`, keys in
# memory only. tokio-rustls serves the local TLS server and is already in Cargo.lock.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
